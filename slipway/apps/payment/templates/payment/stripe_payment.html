<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slipway — Stripe payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <main class="mx-auto flex min-h-screen max-w-5xl items-center justify-center px-6 py-12">
    <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-teal-700">Slipway billing</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight">Add payment method</h1>
      <p class="mt-2 text-sm text-slate-600">Use Stripe to securely add your card for future launch billing.</p>
      <div class="mt-8 rounded-xl border border-slate-200 bg-slate-50 p-4">
        <p class="text-sm font-medium text-slate-700">Stripe checkout placeholder</p>
        <p class="mt-1 text-sm text-slate-500">Mount Stripe Elements or redirect to a hosted checkout session here.</p>
      </div>
      <button type="button" class="mt-6 w-full rounded-lg bg-teal-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-teal-800">Continue to Stripe</button>
    </section>
  </main>
</body>
</html>
